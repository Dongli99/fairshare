name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
  windows-says-unsupported:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: bash
        run: |
          set +e
          out=$(PYTHONPATH=src python -c "import fairshare.cli" 2>&1); code=$?
          echo "exit $code: $out"
          [ "$code" = 1 ] && echo "$out" | grep -q "macOS and Linux"
