<svg xmlns="http://www.w3.org/2000/svg" width="854" height="377" viewBox="0 0 854 377" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">fairshare demo</title>
<desc id="d">fairshare: use multiple AI subscriptions like one. fairshare status ranks three made-up accounts by real usage; fairshare starts a session on the best one, two; when two reaches 95% of its 5-hour window, fairshare tells the agent, which writes a checkpoint and runs fairshare pickup, and the same session continues on one. Install: pipx install fairshare-cli.</desc>
