<text class="a k0" x="427" y="196" text-anchor="middle"><tspan class="h1">fairshare</tspan></text>
<text class="a k1" x="427" y="232" text-anchor="middle"><tspan class="h2">Use multiple AI subscriptions like one.</tspan></text>
<text class="a k2" x="427" y="25" text-anchor="middle"><tspan class="t">1/3  every account, ranked by real usage</tspan></text>
<text class="a k3" x="18" y="57"><tspan class="g">$ </tspan><tspan class="c">█</tspan></text>
<text class="a k4" x="18" y="57"><tspan class="g">$ </tspan><tspan class="c">█</tspan></text>
<text class="a k5" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">f</tspan><tspan class="c">█</tspan></text>
<text class="a k6" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fa</tspan><tspan class="c">█</tspan></text>
<text class="a k7" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fai</tspan><tspan class="c">█</tspan></text>
<text class="a k8" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fair</tspan><tspan class="c">█</tspan></text>
<text class="a k9" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairs</tspan><tspan class="c">█</tspan></text>
<text class="a k10" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairsh</tspan><tspan class="c">█</tspan></text>
<text class="a k11" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairsha</tspan><tspan class="c">█</tspan></text>
<text class="a k12" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshar</tspan><tspan class="c">█</tspan></text>
<text class="a k13" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare</tspan><tspan class="c">█</tspan></text>
<text class="a k14" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare </tspan><tspan class="c">█</tspan></text>
<text class="a k15" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare s</tspan><tspan class="c">█</tspan></text>
<text class="a k16" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare st</tspan><tspan class="c">█</tspan></text>
<text class="a k17" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare sta</tspan><tspan class="c">█</tspan></text>
<text class="a k18" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare stat</tspan><tspan class="c">█</tspan></text>
<text class="a k19" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare statu</tspan><tspan class="c">█</tspan></text>
<text class="a k20" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare status</tspan><tspan class="c">█</tspan></text>
<text class="a k21" x="18" y="57"><tspan class="g">$ </tspan><tspan class="w">fairshare status</tspan></text>
<text class="a k22" x="18" y="76"><tspan class="g">&gt;</tspan><tspan class="f"> two          claude-pro     score   1.67  seven_day 55% used, resets in 27h</tspan></text>
<text class="a k23" x="18" y="95"><tspan class="f"> </tspan><tspan class="f"> one          claude-pro     score   1.56  seven_day 25% used, resets in 48h</tspan></text>
<text class="a k24" x="18" y="114"><tspan class="f"> </tspan><tspan class="f"> three        claude-pro     score  -2.00  five_hour 100% used, resets in 2.0h</tspan><tspan class="y">  [avoid] usable at 16:12</tspan></text>
<text class="a k25" x="18" y="152"><tspan class="g">$ </tspan><tspan class="c">█</tspan></text>
<text class="a k26" x="427" y="25" text-anchor="middle"><tspan class="t">2/3  a session starts on the best account</tspan></text>
<text class="a k27" x="18" y="152"><tspan class="g">$ </tspan><tspan class="c">█</tspan></text>
<text class="a k28" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">f</tspan><tspan class="c">█</tspan></text>
<text class="a k29" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fa</tspan><tspan class="c">█</tspan></text>
<text class="a k30" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fai</tspan><tspan class="c">█</tspan></text>
<text class="a k31" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fair</tspan><tspan class="c">█</tspan></text>
<text class="a k32" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairs</tspan><tspan class="c">█</tspan></text>
<text class="a k33" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairsh</tspan><tspan class="c">█</tspan></text>
<text class="a k34" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairsha</tspan><tspan class="c">█</tspan></text>
<text class="a k35" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairshar</tspan><tspan class="c">█</tspan></text>
<text class="a k36" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairshare</tspan><tspan class="c">█</tspan></text>
<text class="a k37" x="18" y="152"><tspan class="g">$ </tspan><tspan class="w">fairshare</tspan></text>
<text class="a k38" x="18" y="171"><tspan class="f">  1 </tspan><tspan class="g">&gt;</tspan><tspan class="f"> two          seven_day 55% used, resets in 27h</tspan></text>
<text class="a k39" x="18" y="190"><tspan class="f">  2 </tspan><tspan class="g"> </tspan><tspan class="f"> one          seven_day 25% used, resets in 48h</tspan></text>
<text class="a k40" x="18" y="209"><tspan class="b">starting two in 3 s · Enter = now · 1-2 = that account · q = quit</tspan></text>
<text class="a k41" x="18" y="209"><tspan class="b">starting two in 2 s · Enter = now · 1-2 = that account · q = quit</tspan></text>
<text class="a k42" x="18" y="209"><tspan class="b">starting two in 1 s · Enter = now · 1-2 = that account · q = quit</tspan></text>
<text class="a k43 s" x="427" y="25" text-anchor="middle"><tspan class="t">3/3  near a limit, the session moves itself</tspan></text>
<text class="a k44 s" x="18" y="57"><tspan class="d">&gt; </tspan><tspan class="w">add retries to the upload client</tspan></text>
<text class="a k45 s" x="18" y="304"><tspan class="d">──────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text class="a k46 s" x="18" y="323"><tspan class="d">&gt; </tspan><tspan class="c">█</tspan></text>
<text class="a k47 s" x="18" y="342"><tspan class="d">──────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text class="a k48" x="18" y="361"><tspan class="d">two · 5h 20% · 7d 55%</tspan></text>
<text class="a k49 s" x="18" y="95"><tspan class="g">● </tspan><tspan class="f">Read src/upload.py</tspan></text>
<text class="a k50 s" x="18" y="114"><tspan class="g">● </tspan><tspan class="f">Update src/upload.py (+24 −6)</tspan></text>
<text class="a k51 s" x="18" y="133"><tspan class="g">● </tspan><tspan class="f">Bash pytest -q · 41 passed</tspan></text>
<text class="a k52 s" x="18" y="152"><tspan class="d">              · · ·  40 minutes later  · · ·</tspan></text>
<text class="a k53 s" x="18" y="171"><tspan class="g">● </tspan><tspan class="f">Update src/retry.py</tspan></text>
<text class="a k54 s" x="18" y="361"><tspan class="d">two · </tspan><tspan class="y">5h 95% (16:00)</tspan><tspan class="d"> · 7d 62%</tspan></text>
<text class="a k55 s" x="18" y="190"><tspan class="d">  ↳ fairshare tells the agent: </tspan><tspan class="b">account two is at 95% of its 5h window … Best other account: one</tspan></text>
<text class="a k56 s" x="18" y="209"><tspan class="g">● </tspan><tspan class="w">two is at 95%: checkpointing, then moving this session to one.</tspan></text>
<text class="a k57 s" x="18" y="228"><tspan class="g">● </tspan><tspan class="f">Bash fairshare checkpoint "upload.py retries done; retry.py next"</tspan></text>
<text class="a k58 s" x="18" y="247"><tspan class="g">● </tspan><tspan class="f">Bash fairshare pickup</tspan></text>
<text class="a k59" x="18" y="57"><tspan class="b">fairshare · picking up 7c1e04b2 (Opus 5.5 · high)…</tspan></text>
<text class="a k60" x="18" y="95"><tspan class="g">● </tspan><tspan class="f">Bash pytest -q · 41 passed</tspan></text>
<text class="a k61" x="18" y="114"><tspan class="g">● </tspan><tspan class="f">Update src/retry.py</tspan></text>
<text class="a k62" x="18" y="133"><tspan class="g">● </tspan><tspan class="w">two is at 95%: checkpointing, then moving this session to one.</tspan></text>
<text class="a k63" x="18" y="152"><tspan class="g">● </tspan><tspan class="f">Bash fairshare checkpoint "upload.py retries done; retry.py next"</tspan></text>
<text class="a k64" x="18" y="171"><tspan class="g">● </tspan><tspan class="f">Bash fairshare pickup</tspan></text>
<text class="a k65" x="18" y="209"><tspan class="d">&gt; </tspan><tspan class="w">fairshare moved this session from account two to account one because a move was asked for. Continue</tspan></text>
<text class="a k66" x="18" y="228"><tspan class="d">  </tspan><tspan class="w">where you left off.</tspan></text>
<text class="a k67" x="18" y="361"><tspan class="d">one · 5h 5% · 7d 25%</tspan></text>
<text class="a k68" x="18" y="266"><tspan class="g">● </tspan><tspan class="f">Update src/retry.py (+18 −2)</tspan></text>
<text class="a k69" x="18" y="285"><tspan class="g">● </tspan><tspan class="f">Bash pytest -q · 44 passed</tspan></text>
<text class="a k70" x="427" y="212" text-anchor="middle"><tspan class="g3">$ </tspan><tspan class="h3">pipx install fairshare-cli</tspan></text>
</svg>
