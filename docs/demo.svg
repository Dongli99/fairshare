<svg xmlns="http://www.w3.org/2000/svg" width="854" height="377" viewBox="0 0 854 377" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">fairshare demo</title>
<desc id="d">fairshare status ranks three made-up accounts by real usage; fairshare starts a session on the best one, two; two hits its 5-hour limit mid-task and the status bar says when it resets and that a pickup moves the session to one; ! fairshare pickup continues the same session on one.</desc>
