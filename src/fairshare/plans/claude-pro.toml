# Capacity is relative to Pro (= 1.0), so 10% of a bigger plan counts for more.
name = "claude-pro"
provider = "claude"
capacity = 1.0
names = ["pro"]   # what `claude auth status` calls this plan; used to detect it

[windows.short]
name = "five_hour"
hours = 5

[windows.long]
name = "seven_day"
hours = 168
# Percent of this window that one full short window (scaled by capacity) uses, measured on
# Pro from two accounts' usage logs (2026-11-26: 13.2 and 13.1); the handoff stage counts
# the week's room in short windows by it. Assumed for plans that scale both windows alike.
per_short = 13.0
