# Capacity is relative to Pro (= 1.0), so 10% of a bigger plan counts for more.
name = "claude-max5x"
provider = "claude"
capacity = 5.0
# No `names` list: the provider's own name for this plan is unverified (only "pro" has been
# observed), so it is not detected and accounts.toml decides.

[windows.short]
name = "five_hour"
hours = 5

[windows.long]
name = "seven_day"
hours = 168
