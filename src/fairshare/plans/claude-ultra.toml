# Capacity is relative to Pro (= 1.0), so 10% of a bigger plan counts for more.
# Anthropic, "What is the Ultra plan?" (support.claude.com, read 2026-11-09): "10 times the Pro
# plan's usage every week" and no five-hour limit for verified accounts (unverified accounts get
# a temporary one). Formerly Max 20x.
name = "claude-ultra"
provider = "claude"
capacity = 10.0
names = ["ultra"]   # unverified: only "pro" has been seen from `claude auth status`

# Usually absent for Ultra; an absent window counts as unused, a temporary one is honoured.
[windows.short]
name = "five_hour"
hours = 5

[windows.long]
name = "seven_day"
hours = 168
# Percent of this window that one full short window (scaled by capacity) uses, measured on
# Pro from two accounts' usage logs (2026-11-26: 13.2 and 13.1); the handoff stage counts
# the week's room in short windows by it. Assumed for plans that scale both windows alike.
per_short = 13.0
