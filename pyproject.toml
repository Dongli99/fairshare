[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairshare"
version = "0.0.1"
description = "Route AI-assistant sessions across several subscriptions by real usage, so each is used fully and none hits its limit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fairshare = "fairshare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fairshare"]
